<!-- title: Product tour -->
<!-- description: A 90-second guided tour of Carbon Khata: one steel lot from the mill, through a stockist and a Ludhiana workshop, to a verifier-signed EU CBAM file. -->
<!-- page: tour -->
<!-- scripts: https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js, /assets/tour.js -->

<style>
.tour-speed {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-card, #131816);
  border: 1px solid var(--border-card, rgba(255, 255, 255, 0.12));
  border-radius: 999px;
  padding: 3px 5px;
  flex: none;
}
.speed-btn {
  background: transparent;
  border: 0;
  color: var(--text-tertiary, #85827A);
  font-family: var(--font-mono, "Geist Mono", monospace);
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 28px;
}
.speed-btn:hover {
  color: var(--text-primary, #F2EFE8);
}
.speed-btn.on {
  background: var(--brand-molten, #FF5B1F);
  color: #fff;
  box-shadow: 0 0 8px rgba(255, 91, 31, 0.4);
}
.quick-jump {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px dashed var(--border-subtle, rgba(255, 255, 255, 0.08));
}
.quick-jump-label {
  display: block;
  font-size: 11px;
  font-family: var(--font-mono, "Geist Mono", monospace);
  color: var(--text-tertiary, #85827A);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.quick-jump-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.jump-btn {
  background: var(--surface-card, #131816);
  border: 1px solid var(--border-card, rgba(255, 255, 255, 0.1));
  color: var(--text-secondary, #B9B6AD);
  font-size: 11.5px;
  font-weight: 500;
  padding: 4px 9px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.jump-btn:hover {
  background: var(--surface-elevated, #1A201D);
  color: var(--text-primary, #F2EFE8);
  border-color: var(--border-highlight, rgba(255, 255, 255, 0.2));
}
.jump-btn.on {
  border-color: var(--brand-amber, #FFB547);
  color: var(--brand-amber, #FFB547);
  background: rgba(255, 181, 71, 0.08);
}
@media (max-width: 640px) {
  .quick-jump { display: none; }
  .tour-speed { padding: 2px 3px; }
  .speed-btn { padding: 3px 7px; font-size: 11px; }
}
@media (max-width: 360px) {
  .tour-stage { min-height: 400px; height: 420px; }
  .tour-bar-in { gap: 8px; }
  .tour-ctrl { width: 38px; height: 38px; }
}
</style>

<section class="tour" aria-label="Product tour">
  <div class="tour-main">
    <div class="tour-copy" aria-live="polite">
      <div class="chap" id="tChap"></div>
      <h1 id="tTitle"></h1>
      <p id="tText"></p>
      <div class="stat" id="tStat"></div>
      <div class="who"><div class="av" id="tWhoIco"></div><div><b id="tWho"></b><span id="tWhoRole"></span></div></div>
      
      <div class="quick-jump" id="quickJump" role="group" aria-label="Quick jump to chapter">
        <span class="quick-jump-label">Judicial Quick Jump</span>
        <div class="quick-jump-btns">
          <button class="jump-btn on" data-i="0" type="button">1. Mill</button>
          <button class="jump-btn" data-i="1" type="button">2. Stockist</button>
          <button class="jump-btn" data-i="2" type="button">3. WhatsApp</button>
          <button class="jump-btn" data-i="3" type="button">4. Exporter</button>
          <button class="jump-btn" data-i="4" type="button">5. Verifier</button>
          <button class="jump-btn" data-i="5" type="button">6. Importer</button>
          <button class="jump-btn" data-i="6" type="button">7. Lender</button>
          <button class="jump-btn" data-i="7" type="button">8. Cluster</button>
        </div>
      </div>
    </div>
    <div class="tour-stage" id="stage">
      <div class="cursor" id="cursor" aria-hidden="true"><span class="ripple"></span><svg viewBox="0 0 22 22" width="22" height="22"><path d="M3 2l15 8.5-6.3 1.4L8.8 18z" fill="#fff" stroke="#0A0C0B" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <div class="tour-bar">
    <div class="tour-bar-in">
      <button class="tour-ctrl" id="tPrev" aria-label="Previous chapter"><span data-icon="prev"></span></button>
      <button class="tour-ctrl main" id="tPlay" aria-label="Pause"><span data-icon="pause"></span></button>
      <button class="tour-ctrl" id="tNext" aria-label="Next chapter"><span data-icon="next"></span></button>
      <div class="tour-speed" id="tSpeed" role="group" aria-label="Playback speed">
        <button class="speed-btn on" data-speed="1" type="button" aria-pressed="true">1x</button>
        <button class="speed-btn" data-speed="1.5" type="button" aria-pressed="false">1.5x</button>
      </div>
      <div class="chapters" id="tChapters" role="tablist" aria-label="Chapters"></div>
      <span class="tour-hint">Space to pause · ← → to step</span>
    </div>
  </div>
</section>
